# Netlify Deployment Configuration for Mellow Bakery

[build]
  publish = "."

# SPA / Clean URL Redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache Control Headers for Performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
